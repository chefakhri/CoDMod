# FastDL (HTTP downloads for sv_downloadurl). Plain HTTP: many CS 1.6 clients can't use HTTPS.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    access_log /dev/stdout;

    # Only game content types are served
    location ~* \.(bsp|res|txt|wad|mdl|wav|mp3|spr|tga|bmp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # Health check for uptime monitors (e.g. Zoraxy's)
    location = / {
        default_type text/plain;
        return 200 "FastDL OK\n";
    }

    location / {
        return 404;
    }
}
