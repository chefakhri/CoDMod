# Example deployment. Copy docker/.env.example to docker/.env, fill it in, then:
#   docker compose -f docker/compose.yaml up -d --build
services:
  cs16:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: codmod-cs16:latest
    container_name: cs16-codmod
    restart: unless-stopped
    depends_on: [db]
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "27015:27015/udp"   # game + rcon (GoldSrc uses UDP only)
    volumes:
      - ./data/overlay:/overlay:ro                                       # optional extra files copied over cstrike/
      - ./data/logs/amxmodx:/home/steam/hlds/cstrike/addons/amxmodx/logs
      - ./data/logs/hlds:/home/steam/hlds/cstrike/logs
      - vault:/home/steam/hlds/cstrike/addons/amxmodx/data/vault        # nvault (missions, icons, knives, ...)
      - yapb:/home/steam/hlds/cstrike/addons/yapb/data                  # bot navigation graphs
      - fastdl:/fastdl                                                   # files served by the fastdl service
    stdin_open: true        # "docker attach cs16-codmod" for the server console
    tty: true

  fastdl:
    image: nginx:1.27-alpine
    container_name: cs16-codmod-fastdl
    restart: unless-stopped
    depends_on: [cs16]    # cs16 must create the volume first, so it owns it
    ports:
      - "27080:80"          # HTTP downloads (sv_downloadurl); put a plain-HTTP proxy in front
    volumes:
      - type: volume
        source: fastdl
        target: /usr/share/nginx/html
        read_only: true
        volume:
          nocopy: true   # don't fill the volume with nginx's default pages
      - ./fastdl.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: mariadb:10.11
    container_name: cs16-codmod-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-codmod}
      MARIADB_USER: ${DB_USER:-codmod}
      MARIADB_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      TZ: ${TZ:-UTC}        # same timezone as the game server (from .env)
    volumes:
      - ./data/db:/var/lib/mysql

volumes:
  vault:
  yapb:
  fastdl:
