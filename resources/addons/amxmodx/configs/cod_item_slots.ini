; CoD Mod item slots
; Only used when 2 item slots are enabled (/ca -> Item slots, or cvar cod_item_slots 2).
; Each item belongs to one slot: 1 = combat, 2 = support. A player holds at most one item per slot.
;
; Items that change the same player state must stay in the same slot, or they would cancel each
; other out. The mod checks these groups at map start and moves a split group to slot 1:
;   invisibility, bunny hop, gravity, enemy slow, recoil eliminator, unlimited ammo, rocket stock,
;   dynamite stock, enemy uniform, primary weapons, pistols (see DEPLOY.md, "Item slots").
; Items missing from this file use slot 1.
;
; Format: <item plugin without .amxx> <slot>

