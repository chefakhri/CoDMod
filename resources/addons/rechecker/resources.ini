#
# ReChecker (https://github.com/rehlds/ReChecker): asks every connecting player's game for the
# hash of the files below and runs the command when it matches. Only files listed here are
# checked; the mod's own models, sprites and sounds are not affected.
#
# LOG-ONLY MODE: every rule runs "echo", so nobody is kicked. ReChecker writes each match to
# addons/rechecker/logs/ (rch_log 1, set by docker/entrypoint.sh), with the player's name.
# Review the log for a while before changing any "echo" into "kick [userid] '...'".
#
# Never put [name] into a command: the player chooses their name and ReChecker doesn't clean it,
# so a name containing ";" would run server commands. The log already records the name.
#
#	-> Format
#		path to file		hash		"command"		flags
#		"../opengl32.dll"	3cc7f256	"echo ..."		BREAK
#	Paths are relative to the client's cstrike folder ("../" = the game folder).
#	Hash = first 8 characters of the file's MD5. UNKNOWN = any hash, MISSING = file missing.
#	Template keys: [userid] [steamid] [ip] [id] [file_name] [file_hash] [file_md5hash]
#	Flags: BREAK = stop checking further files after a match, IGNORE = never match this hash.
#

; Check that ReChecker works: logs the engine file's hash for every Windows player
; (one line per connect). Also shows which client builds people use.
"../hw.dll"					UNKNOWN		"echo [ReChecker] client engine hw.dll md5 [file_md5hash] userid [userid] [steamid]"

; DemoPlayer.dll: known cheat versions
"../demoplayer.dll"				ad6d0e43	"echo [ReChecker] WallHack (demoplayer.dll) userid [userid] [steamid]"		BREAK
"../demoplayer.dll"				cca8c33f	"echo [ReChecker] WallHack (demoplayer.dll) userid [userid] [steamid]"		BREAK
"../demoplayer.dll"				36ad16fd	"echo [ReChecker] NoRecoil (demoplayer.dll) userid [userid] [steamid]"		BREAK
"../demoplayer.dll"				c599a6de	"echo [ReChecker] HLR Leis 10 (demoplayer.dll) userid [userid] [steamid]"	BREAK

; DemoPlayer.dll: original files
"../demoplayer.dll"				7ef5b581	IGNORE
"../demoplayer.dll"				bdc52384	IGNORE

; DemoPlayer.dll: any other version (unknown, may be fine)
"../demoplayer.dll"				UNKNOWN		"echo [ReChecker] unknown demoplayer.dll md5 [file_md5hash] userid [userid] [steamid]"

; OpenGL wrapper in the game folder (most wallhacks; some graphics fixes use it too)
"../opengl32.dll"				UNKNOWN		"echo [ReChecker] opengl32.dll md5 [file_md5hash] userid [userid] [steamid]"		BREAK

