;
; @package: YaPB (CoD Mod fork)
; @filename: ms_chat.cfg
;
; Casual, friendly Malay-English bot chat, with some lines in Penang (utara) loghat.
; Used instead of en_chat.cfg when YAPB_CHAT=ms (Docker), or copy it over
; addons/yapb/conf/lang/en_chat.cfg yourself.
;
; Placeholders: %v = victim (needed in every [KILLED] line), %s = the player who chatted,
; %m = current map, %t = a player's name.
; Keep it friendly: casual is fine, but no teasing, no crude words, no jokes about race or religion.
;

[BOMBPLANT]
Alamak, bom dah tanam! Jom cari sama-sama.
%t, jom tolong defuse, cepat sikit!
Wire merah ke biru eh? Cuba dulu lah.
Rilek semua, masa ada lagi.
Awat lambat sangat, jom pi site cepat!
Sat, sat, aku pi check site B dulu.
//
// Messages after killing somebody (every line needs %v)
//
[KILLED]
Sorry ah %v, tak sengaja. GG!
%v, nice try bro! Next round confirm hang dapat.
Thanks %v, round tadi best!
%v, hang main power tadi, aku cuma lucky.
Jangan ambik hati ah %v, game je ni.
%v, sikit lagi hang dapat aku tadi!
GG %v, jumpa next round.
Rezeki aku round ni, %v. Next round turn hang pulak!
%v, steady la cara main hang tadi.
Ampun %v, aku pun terkejut jugak, haha.
//
// When the bot joins the server
//
[WELCOME]
Salam semua, apa khabar?
Hai geng, sihat ka semua?
Wassup semua! Ready nak main?
Apa cerita semua? Jom main!
Hang semua sihat dak? Lama tak jumpa!
Salam semua, harap semua okay hari ni.
//
// Random chat while dead
//
[DEADCHAT]
Alamak, aku dah jatuh. Good luck semua!
%t, hang boleh punya! Jom!
Semua okay ka? Aku tengok dari tepi dulu.
Dah makan ka semua? Jangan lupa makan tau.
Map %m ni mencabar jugak eh.
Takpe, next round aku cuba lagi.
Jangan lupa minum air, semua!
Best main dengan korang hari ni.
Hati-hati, depa ada dekat sana tu.
Satgi round habis, aku masuk balik.
Pi mai pi mai, mati jugak aku, haha.
Lagu mana depa tau aku dok situ?
//
// Replies when a chat message contains a keyword
//
[REPLIES]

@KEY "APA KHABAR", "APA CERITA", "SIHAT", "HOW ARE YOU"
Baik je, thanks %s! Hang lagu mana?
Alhamdulillah sihat, %s. Kau pulak?
Okay je, %s. Thanks tanya!

@KEY " HI ", " HAI ", "HELLO", "SALAM", "ASSALAMUALAIKUM"
Waalaikumussalam, hai %s! Apa khabar?
Hai %s! Sihat ka hari ni?
Hello %s, welcome! Enjoy tau.

@KEY "TERIMA KASIH", "THANK", "THANKS", " TQ "
Sama-sama %s!
No hal lah %s!

@KEY "SORRY", "MAAF", "SRY"
Takpe %s, rilek je.
Tak dak hal lah %s, game je.

@KEY " GG ", "GOOD GAME"
GG %s! Thanks main sekali.
GG semua, best main dengan hang, %s.

@KEY "LAG", "PING"
Sabar ya %s, internet slow sat kot.
Harap lag tu hilang cepat, %s.

@KEY "BOT", "BOTS"
Haha ya %s, aku bot, tapi aku cuba main elok!
Thanks main dengan kami, %s.

@KEY "HAHA", "LOL", "HEHE", "WKWK", ":)"
Hehe, happy tengok hang seronok, %s!
Haha, best kan %s?

@KEY "CAMP", "CAMPER", "CAMPING"
Sorry %s, aku jaga kawasan sat je.
Okay %s, aku gerak lebih lepas ni.

@KEY "CHEAT", "HACK", "AIMBOT", "WALLHACK"
Tak dak cheat lah %s, aku lucky je.
Kita main fair ya %s.

@KEY "NOOB", "NUB"
Semua orang start dari bawah, %s.
Jangan risau %s, lama-lama terer jugak.

@KEY "MAKAN", "LAPAR", "NASI", "MAMAK"
Jangan lupa makan tau %s! Dah makan ka?
Jom pi mamak lepas main satgi, %s!

@KEY "TIDUR", "NGANTUK", "MENGANTUK", "PENAT"
Rehat la kalau penat, %s.
Kalau mengantuk, tidur dulu %s. Esok kita main lagi.

@KEY "MAP", "RTV"
Nak tukar map, taip /rtv ya %s.
Map %m ni best jugak, %s.

@KEY "BEST", "POWER", "TERBAIK", "MANTAP"
Thanks %s! Hang pun terbaik.
Mantap %s, teruskan!

@KEY "SUSAH", "PENING"
Sabar %s, sikit-sikit lama-lama jadi bukit.
Jangan give up %s, hang boleh!

@KEY "AWAT", "PASAI APA", "KENAPA"
Entah lah %s, aku pun tak tau, haha.
Habaq mai la %s, awat?

//
// Replies when no keyword matches
//
[UNKNOWN]
Sorry %s, tak faham sangat. Boleh ulang?
Okay %s, thanks!
Betul jugak cakap hang, %s.
Okay %s, jom sambung main.
Menarik tu %s!
Thanks borak, %s. Sihat ka hari ni?
